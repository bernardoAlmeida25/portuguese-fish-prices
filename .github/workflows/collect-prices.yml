name: Recolher preços do pescado

on:
  schedule:
    # 20:00 e 21:00 UTC; o job só recolhe quando são 21h em Europe/Lisbon.
    - cron: "0 20 * * *"
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fish-price-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Obter repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: python -m pip install requests beautifulsoup4

      - name: Verificar hora de Portugal
        id: localtime
        run: |
          HOUR="$(TZ=Europe/Lisbon date +%H)"
          echo "hour=$HOUR" >> "$GITHUB_OUTPUT"
          echo "Hora local em Lisboa: $(TZ=Europe/Lisbon date '+%Y-%m-%d %H:%M:%S %Z')"

      - name: Recolher dados
        if: steps.localtime.outputs.hour == '21' || github.event_name == 'workflow_dispatch'
        run: python fish_prices.py

      - name: Gerar JSON para o site
        if: steps.localtime.outputs.hour == '21' || github.event_name == 'workflow_dispatch'
        run: python build_json.py

      - name: Guardar histórico e JSON
        if: steps.localtime.outputs.hour == '21' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fish_prices.csv data/fish_prices.json
          if git diff --cached --quiet; then
            echo "Não existem alterações para guardar."
          else
            git commit -m "data: atualizar preços do pescado"
            git push
          fi
