name: Recolher preços do pescado

on:
  schedule:
    # Verão: 20:00 UTC = 21h em Lisboa · Inverno: 21:00 UTC = 21h em Lisboa
    - cron: "0 20 * * *"
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fish-price-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: Verificar hora de Portugal
        id: localtime
        run: echo "hour=$(TZ=Europe/Lisbon date +%H)" >> "$GITHUB_OUTPUT"

      - name: Recolher e gerar dados
        if: steps.localtime.outputs.hour == '21' || github.event_name == 'workflow_dispatch'
        run: |
          uv run fish_prices.py
          uv run build_json.py

      - name: Guardar histórico e dados do site
        if: steps.localtime.outputs.hour == '21' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fish_prices.csv site/data
          if git diff --cached --quiet; then
            echo "Não existem alterações para guardar."
          else
            git commit -m "data: atualizar preços do pescado"
            git push
          fi